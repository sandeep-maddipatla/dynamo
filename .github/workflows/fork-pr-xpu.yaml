# Fork-only trigger: run XPU CI on the self-hosted XPU runner for pull requests
# opened inside this fork. Upstream uses pr-xpu.yaml (copy-pr-bot pull-request/N
# branches), which never fires on a fork.

name: Fork-PR-XPU

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: fork-pr-xpu-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  xpu-ci-vllm:
    # Only PRs from branches of this repository: never run code from someone
    # else's fork on the self-hosted runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: $/.github/workflows/xpu-ci.yaml
    with:
      framework: vllm
      pytest_markers: 'vllm and pre_merge and not multimodal'
